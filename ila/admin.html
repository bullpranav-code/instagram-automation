<div id="login"><b style="font-size:18px">Admin access</b><p style="font-size:14px;color:#8A968E;margin:6px 0 0">Enter the trainer key once on this device.</p>
<input id="key" type="password" placeholder="Trainer key"><button class="btn" id="go">Open dashboard</button><div class="err" id="err"></div></div>
<iframe id="f" style="display:none" title="Dashboard"></iframe>
<script>
const ILA='https://script.google.com/macros/s/AKfycbxeg3TnuiM5YzhW5nzM5CBatFa2PHTkaOdPjzWULSONS5BNu5HBh5bsfr1i44jbTdeW/exec';
const KILI='https://script.google.com/macros/s/AKfycbzm5pCgvF4zDj7oGMvGiFY-hl_OHOhJjl8oTl0RrzuayQjeVQpBfyYoYG6DkYZqqspO/exec';
const $=id=>document.getElementById(id);let key='';try{key=localStorage.getItem('accent_admin')||''}catch(e){}
function open(v){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
 $('f').src=(v==='kili'?KILI+'?view=calls&key=':ILA+'?view=admin&key=')+encodeURIComponent(key)+'&t='+Date.now();try{localStorage.setItem('accent_admin_tab',v)}catch(e){}}
function start(){$('login').style.display='none';$('f').style.display='block';$('tabs').style.display='flex';$('out').style.display='inline';let t='ila';try{t=localStorage.getItem('accent_admin_tab')||'ila'}catch(e){}open(t);}
$('go').onclick=()=>{key=$('key').value.trim();if(!key){$('err').textContent='Enter the key.';return}try{localStorage.setItem('accent_admin',key)}catch(e){}start();};
$('key').onkeydown=e=>{if(e.key==='Enter')$('go').click()};
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>open(b.dataset.v));
$('out').onclick=e=>{e.preventDefault();try{localStorage.removeItem('accent_admin')}catch(e){}location.reload();};
if(key)start();
</script></body></html>
